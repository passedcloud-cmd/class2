<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      body {
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .genre-books {
        width: 80%;
        margin: 0 auto;
        padding: 3rem 0;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 2rem;
      }

      /* Flexbox 그리드 컨테이너 (직접 작성할 것) */
      .genre-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .genre-item {
        position: relative;
        /* 4열: (전체 폭 - gap 3개) / 4 */
        flex: 0 0 calc((100% - 3rem) / 4);
        height: 200px;
        border-radius: 0.5rem;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .genre-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .genre-item:hover img {
        transform: scale(1.05);
      }
      .genre-name {
        position: absolute;
        left: 0.75rem;
        bottom: 0.5rem;
        margin: 0;
        color: #fff;
        font-family: "SBAggro_L";
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      /* 모바일(576px 미만): 1열 배치 */
      @media (max-width: 575.98px) {
        .genre-item {
          flex: 0 0 100%;
        }
      }
    </style>
  </head>
  <body>
    <section class="genre-books">
      <h3 class="section-title">장르별 도서 목록</h3>
      <!-- 
        [과제 안내]
        아래 영역에 Flexbox 컨테이너(예: <div class="genre-grid">)를 만들고,
        각 장르 아이템을 4열로 배치하는 코드를 작성하세요.
        * 화면 폭 576px 이하에서는 1열로 배치되도록 미디어 쿼리가 적용되어야 합니다.
      -->
      <!-- 코드는 여기에 작성하시오 -->
      <div class="genre-grid">
        <div class="genre-item">
          <img src="assets/genre/travel.jpg" alt="여행" />
          <p class="genre-name">여행</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/health.jpg" alt="건강" />
          <p class="genre-name">건강</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/art.jpg" alt="예술" />
          <p class="genre-name">예술</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/history.jpg" alt="역사" />
          <p class="genre-name">역사</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/economy.jpg" alt="경제" />
          <p class="genre-name">경제</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/philosophy.jpg" alt="철학" />
          <p class="genre-name">철학</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/natural_science.jpg" alt="자연과학" />
          <p class="genre-name">자연과학</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/baby.jpg" alt="육아" />
          <p class="genre-name">육아</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/youth.jpg" alt="청소년" />
          <p class="genre-name">청소년</p>
        </div>
        <div class="genre-item">
          <img src="assets/genre/romance.jpg" alt="로맨스" />
          <p class="genre-name">로맨스</p>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
