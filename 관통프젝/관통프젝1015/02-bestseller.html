<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Bestseller</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      /* 베스트셀러 섹션 */
      .bestseller-container {
        display: flex;
        align-items: center;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }
      .book-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .book-cover {
        width: 150px;
        height: 220px;
        object-fit: cover;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }
      .book-title {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #555;
      }
      /* Next 버튼: 이미지 영역 세로 중앙, 붉은 원형 버튼 */
      .bestseller .carousel-control-next {
        top: 95px;
        bottom: auto;
        right: 0;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: rgba(254, 74, 81, 0.6);
        opacity: 1;
      }
      .bestseller .carousel-control-next:hover {
        background-color: rgba(254, 74, 81, 0.9);
      }
      .bestseller .carousel-control-next-icon {
        width: 1.2rem;
        height: 1.2rem;
      }
      @media (max-width: 767.98px) {
        .bestseller-container {
          flex-direction: column;
        }
        .section-title {
          margin-bottom: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- 베스트셀러 섹션 -->
    <section class="bestseller py-5">
      <div class="container bestseller-container">
        <h3 class="section-title flex-shrink-0 me-md-5">베스트셀러</h3>
        <!-- 
          [과제 안내]
          아래 영역에 Bootstrap Carousel 컴포넌트를 이용해
          - 총 12권의 도서를 4권씩 나눈 슬라이드를 구현하고,
          - 각 도서는 도서 커버 이미지와 제목으로 구성하며,
          - 우측에만 표시되는 Next 컨트롤 버튼을 포함하도록 작성하세요.
        -->
        <!-- 코드는 여기에 작성하시오 -->
        <div
          id="bestsellerCarousel"
          class="carousel slide flex-grow-1 w-100 position-relative"
          data-bs-ride="carousel"
          data-bs-interval="3000"
        >
          <div class="carousel-inner">
            <div class="carousel-item active">
              <div class="row gy-3 justify-content-center">
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img1.jpeg" alt="소년이 온다" class="book-cover" />
                  <p class="book-title">소년이 온다</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img2.jpeg" alt="채식주의자" class="book-cover" />
                  <p class="book-title">채식주의자</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img3.jpeg" alt="대온실 수리 보고서" class="book-cover" />
                  <p class="book-title">대온실 수리 보고서</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img4.jpeg" alt="급류" class="book-cover" />
                  <p class="book-title">급류</p>
                </div>
              </div>
            </div>
            <div class="carousel-item">
              <div class="row gy-3 justify-content-center">
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img5.jpeg" alt="시간의 계곡" class="book-cover" />
                  <p class="book-title">시간의 계곡</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img6.jpeg" alt="인간 실격" class="book-cover" />
                  <p class="book-title">인간 실격</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img7.jpeg" alt="노르웨이의 숲" class="book-cover" />
                  <p class="book-title">노르웨이의 숲</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img8.jpeg" alt="정원에 대하여" class="book-cover" />
                  <p class="book-title">정원에 대하여</p>
                </div>
              </div>
            </div>
            <div class="carousel-item">
              <div class="row gy-3 justify-content-center">
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img9.jpeg" alt="네 칼이 센가, 내 칼이 센가" class="book-cover" />
                  <p class="book-title">네 칼이 센가, 내 칼이 센가</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img10.jpeg" alt="새벽의 사원" class="book-cover" />
                  <p class="book-title">새벽의 사원</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img11.jpeg" alt="위싱 머신" class="book-cover" />
                  <p class="book-title">위싱 머신</p>
                </div>
                <div class="col-6 col-md-3 book-item">
                  <img src="assets/bestsellers/img12.jpeg" alt="모순" class="book-cover" />
                  <p class="book-title">모순</p>
                </div>
              </div>
            </div>
          </div>
          <!-- 우측 Next 컨트롤만 출력 -->
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#bestsellerCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
