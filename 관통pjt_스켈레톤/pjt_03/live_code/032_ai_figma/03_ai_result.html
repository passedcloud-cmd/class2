<!-- AI 생성 초안: 검수 전 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThRead 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFMw6u9/4bNDa4l9g9g1aF6G6d4l5Q5R2Q5Qp" crossorigin="anonymous">
  <style>
    body {
      padding-top: 56px;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, "Noto Sans KR", sans-serif;
    }
    /* Navbar brand and links feel */
    .navbar-brand {
      font-weight: 700;
    }
    .login-card {
      width: min(520px, 90vw);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white border-bottom fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ThRead</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto flex-row gap-3">
          <li class="nav-item">
            <a class="nav-link px-2 text-dark small" href="#">썸레드</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2 text-dark small" href="#">도서 검색</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2 text-dark small" href="#">마이 페이지</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-2 text-dark small" href="#">로그아웃</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container-fluid">
    <div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 56px);">
      <div class="card login-card shadow-sm border-0">
        <div class="card-body p-4">
          <div class="mb-3">
            <label class="form-label fw-semibold mb-1">이메일</label>
            <input type="email" class="form-control" placeholder="name@example.com" aria-label="이메일">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold mb-1">비밀번호</label>
            <input type="password" class="form-control" placeholder="비밀번호를 입력하세요" aria-label="비밀번호">
          </div>
        </div>
        <div class="border-top bg-white p-3">
          <button type="button" class="btn btn-success w-100 fw-semibold" style="background-color:#28a745; border-color:#28a745;">
            로그인
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+2m6Qm0YdP7k6h5Q45f5kCZp3J2xG" crossorigin="anonymous"></script>
</body>
</html>
