<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일(412px 등)에서 화면 폭에 맞게 보이도록 하는 필수 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThRead - 로그인</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* 디자인의 초록색 로그인 버튼 (Bootstrap 버튼 변수만 바꿔서 재사용) */
    .btn-thread {
      --bs-btn-color: #fff;
      --bs-btn-bg: #2db400;
      --bs-btn-border-color: #2db400;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #279e00;
      --bs-btn-hover-border-color: #279e00;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #228a00;
      --bs-btn-active-border-color: #228a00;
    }

    /* 로그인 카드 최대 너비 (데스크톱에서 500px, 모바일에선 화면에 맞게 줄어듦) */
    .login-card {
      max-width: 500px;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container-fluid px-4">
      <!-- 로고 (이미지 대신 텍스트) -->
      <a class="navbar-brand fw-bold fs-3" href="#">ThRead</a>

      <!-- 화면이 좁을 때 나타나는 햄버거 버튼 -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainMenu"
              aria-controls="mainMenu" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- 메뉴 -->
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto gap-md-4">
          <li class="nav-item">
            <a class="nav-link active fw-semibold" aria-current="page" href="#">쓰레드</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="#">도서 검색</a></li>
          <li class="nav-item"><a class="nav-link" href="#">마이 페이지</a></li>
          <li class="nav-item"><a class="nav-link" href="#">로그아웃</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== 로그인 영역 (화면 가운데 정렬) ===== -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center px-3 py-5">
    <div class="card login-card w-100 shadow-sm">
      <form>
        <!-- Form Body -->
        <div class="card-body p-3">
          <div class="mb-4">
            <label for="email" class="form-label fw-semibold">이메일</label>
            <input type="email" class="form-control py-2" id="email"
                   placeholder="name@example.com" required>
          </div>
          <div>
            <label for="password" class="form-label fw-semibold">비밀번호</label>
            <input type="password" class="form-control py-2" id="password"
                   placeholder="비밀번호를 입력하세요" required>
          </div>
        </div>

        <!-- Divider + Footer (card-footer의 윗선이 구분선 역할) -->
        <div class="card-footer bg-transparent px-4 pt-3 pb-4">
          <button type="submit" class="btn btn-thread w-100">로그인</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Bootstrap 5.3.3 JS (햄버거 메뉴 열고 닫기에 필요) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
