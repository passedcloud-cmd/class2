<!-- dom_manipulation.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div>
    <p>DOM 요소 조작</p>
  </div>

  <script>
    // 1. 생성
    // - createElement는 요소를 "메모리에만" 만듦 -> 아직 화면에는 보이지 않음
    // TODO: h1 요소를 만들어 h1Tag에 저장하고, 텍스트를 '제목'으로 넣은 뒤 출력하세요.
    // 결과: <h1>제목</h1> (콘솔에는 보이지만 화면에는 아직 없음)
    const h1Tag = document.createElement('h1') //태그 <h1></h1>을 만든 셈
    h1Tag.textContent = '제목입니다.' // 내용물을 넣어야 함 
    console.log(h1Tag)
    

    // 2. 추가
    // - appendChild로 부모 요소의 마지막 자식으로 넣어야 화면에 보임
    // [실습 포인트/힌트] 부모(div)를 먼저 선택한 뒤 부모.appendChild(자식)
    // TODO: div를 선택해 divTag에 저장하고, h1Tag를 div의 자식으로 추가하세요.
    // 결과: 화면에 '제목'이 나타남
    const divTag = document.querySelector('div')
    divTag.appendChild(h1Tag)

    // 3. 삭제
    // - removeChild로 부모 요소에서 자식 요소를 제거
    // [실습 포인트/힌트] 지울 p를 먼저 선택하고, 부모(divTag)에게 지워 달라고 요청
    // TODO: p를 선택해 div에서 제거하세요.
    // 결과: 'DOM 요소 조작' 문장이 사라지고 '제목'만 남음
    const pTag = document.querySelector('p')
    divTag.removeChild(pTag)
  </script>
</body>

</html>
