<!-- style_property.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <p>Lorem, ipsum dolor.</p>

  <script>
    // style 조작
    // - style 프로퍼티는 HTML 태그에 style="..." 속성을 직접 쓰는 것과 같음
    // - CSS 속성 이름은 카멜 케이스로 작성 (font-size -> fontSize)
    // - 여러 스타일을 한 번에 바꿀 때는 클래스(classList)를 쓰는 것을 권장
    const pTag = document.querySelector('p')

    // [실습 포인트/힌트] 요소.style.속성이름 = '값' (값은 CSS에 쓰는 그대로 문자열로)
    // TODO: pTag의 글자색을 'crimson'으로 바꾸세요.
    console.log(pTag.style)
    pTag.style.color = 'crimson'

    // [실습 포인트/힌트] font-size처럼 하이픈(-)이 있는 속성은 카멜 케이스로
    // TODO: pTag의 글자 크기를 '2rem'으로 바꾸세요.
    pTag.style.fontSize = '2rem'

    // TODO: pTag에 테두리 '1px solid black'을 넣으세요.

    console.log(pTag.style) // CSSStyleDeclaration (지정한 color, fontSize, border 확인 가능)
  </script>
</body>

</html>
