<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1 class="heading">DOM 조작</h1>
  <a href="https://www.google.com/">google</a>
  <p class="content">content1</p>
  <p class="content">content2</p>
  <p class="content">content3</p>
  <ul>
    <li>list1</li>
    <li>list2</li>
  </ul>

  <script>
    // HTML 콘텐츠 조작 (textContent)
    // - textContent: 요소 안의 "순수한 텍스트"를 읽거나 바꿈
    // - 값을 대입하면 기존 내용이 통째로 바뀜
    const h1Tag = document.querySelector('.heading')

    // TODO: h1Tag의 텍스트를 읽어 출력하세요.
    // 결과: DOM 조작
    console.log(h1Tag.textContent)

    // [실습 포인트/힌트] 읽을 때와 같은 textContent에 = 로 새 값을 대입
    // TODO: h1Tag의 텍스트를 '내용 수정'으로 바꾸고, 다시 읽어 출력하세요.
    // 결과: 내용 수정 (화면의 제목도 바로 바뀜)
    h1Tag.textContent = '내용 수정'
    console.log(h1Tag.textContent)
  </script>
</body>

</html>
