<!-- practice_input_event.html -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <input type="text" id="text-input" value="apple"/> 
    <p></p>

    <script>
      // 목표: 사용자 입력 값을 실시간으로 출력하기

      // 1. input 요소 선택하기
      const inputTag = document.querySelector('#text-input')
      // 2. 입력 값을 출력할 태그 선택하기
      const pTag = document.querySelector('p')

      // 3. 이벤트 리스너 작성
      // 3.1 작성하고 있는 값 가져오기
      // [실습 포인트/힌트] 핸들러의 event 객체에서 값이 어디에 있는지 console.log로 찾아보기 (event.currentTarget.value)
      // 3.2 작성한 값을 출력하기
      // input 이벤트가 발생할 때마다 아래 함수가 호출
      const inputHandler = function (event) {
        console.log(event.currentTarget.value)
        pTag.textContent = event.currentTarget.value
      }

      // 4. input 요소에 핸들러 연결하기
      // [실습 포인트/힌트] 글자를 입력할 때마다 발생하는 이벤트 이름은 'input'
      inputTag.addEventListener('input', inputHandler) // 콜백 함수 호출은 input이 입력 될때이므로 ()를 붙이지 않음

    </script>
  </body>
</html>
