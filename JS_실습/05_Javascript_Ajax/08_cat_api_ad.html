<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  
  <button>냥냥펀치</button>
  <div></div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script>
    // 목표: 버튼을 누르면 고양이 이미지를 출력하기
    // 주소는 API_URL 상수에 미리 선언되어 있음
    const API_URL = 'https://api.thecatapi.com/v1/images/search'

    // [실습 포인트/힌트] 1. 버튼을 선택하고, 클릭하면 실행할 함수(getCats)를 만들어 등록
    // 1. 버튼 선택
    const btn = document.querySelector('button')

    // 2. 버튼을 클릭할 때마다 실행할 함수 (이벤트 핸들러)
    const getCats = function () {
      // 2.1 axios로 고양이 이미지 요청
      axios({
        method: 'get',
        url: API_URL
      })
      // 2.2 요쳥이 성공하면 응답데이터에서 이미지 주소를 추출
        .then((response) => {
          console.log(response.data[0].url)
          const imgUrl = response.data[0].url 
          // 2.3 img 태그를 만들고 추출한 주소를 속성 값으로 넣어서 화면에 그리기 
          const imgTag = document.createElement('img')
          imgTag.setAttribute('src', imgUrl)

          const divTag = document.querySelector('div')
          divTag.appendChild(imgTag)

        })
        .catch((error) => {
          console.log(error)
        })
    }

    btn.addEventListener('click', getCats)

    // [실습 포인트/힌트] 2. getCats 안에서 axios로 요청을 보내고 then에서 response.data를 console.log로 확인
    // [실습 포인트/힌트] 3. 응답 데이터에서 이미지 주소가 어디에 있는지 찾기 (배열의 0번 요소의 url)
    // [실습 포인트/힌트] 4. img 요소를 만들고(createElement), src 속성에 주소를 넣고(setAttribute), body에 추가(appendChild)

  </script>
</body>

</html>
