<!-- promise.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // [준비] Promise를 반환하는 함수
    // - 1초 뒤 50% 확률로 성공(resolve) 또는 실패(reject)
    // - 내부의 new Promise 문법은 참고용입니다. 지금은 "Promise를 반환하는 함수"로만 보면 됩니다.
    // - 뒤에서 배울 fetch, axios도 이처럼 Promise를 반환합니다.
    const getRandomData = function () {
      return new Promise((resolve, reject) => {
        const success = Math.random() > 0.5

        setTimeout(() => {
          if (success) {
            resolve('데이터 도착!') // 성공 -> then
          } else {
            reject('에러 발생!') // 실패 -> catch
          }
        }, 1000)
      })
    }

    // 1. 한 번 호출하기
    // [실습 포인트/힌트] 함수().then(성공 콜백).catch(실패 콜백) - 콜백의 매개변수로 결과(data)나 에러(error)를 받음
    // TODO: getRandomData를 호출하고, 성공하면 data를, 실패하면 error를 출력하세요.
    // 결과: 새로고침할 때마다 '데이터 도착!' 또는 '에러 발생!'

    // 프로미스 객체.then(콜백함수)
    // => getRandomData는 1초 뒤에 성공인지 실패인지 결과를 리턴하는 함수 
    // => getRandomData의 결과가 성공이라면 다음 then을 호출 / 실패라면 catch을 호출 
    // => then과 catch는 모두 콜백함수를 인자로 받음
    // => 앞에 과정이 성공 혹은 실패 하느냐에 따라 어떤 로직을 수행할지를 골백함수에 정의 
    // getRandomData()
    // // then 함수의 콜백함수 인자에는 자동으로 이전 작업의 결과가 들어감 
    //   .then((data) => {
    //     console.log(data)
    //   })
    //   // catch 함수 콜백함수의 인자에는 자동으로 이전 then들의 작업 실패 객체를 받음 
    //   .catch((error) => {
    //     console.log(error)
    //   })


    // 2. 3번 연속 호출하기 (then chaining)
    // - then 안에서 다음 Promise를 return하면, 다음 then은 그 결과를 기다림
    // - 1, 2, 3번 중 하나라도 실패하면 남은 then은 건너뛰고 catch로 이동
    // ※ 1번과 동시에 실행하면 출력이 섞이므로, 1번을 주석 처리한 뒤 작성해 실행
    // [실습 포인트/힌트] then 안에서 getRandomData()를 return 하지 않으면 다음 then이 기다리지 않음
    // TODO: then을 3번 이어서 '1번째 성공:', '2번째 성공:', '3번째 성공:'과 결과를 출력하고,
    //       마지막 catch 하나에서 '중간에 실패함:'과 에러를 출력하세요.
    // 결과: 예) 1번째 성공: 데이터 도착! -> 2번째 성공: 데이터 도착! -> 중간에 실패함: 에러 발생!
    getRandomData()
      .then((data1) => {
        console.log('1번째 성공')
        return getRandomData()
      })
      .then((data2) => {
        console.log('2번째 성공')
        return getRandomData()        
      })
      .then((data3) => {
        console.log('3번째 성공')        
      })
      .catch(() => {
        console.log('실패 했음')
      })

    console.log('점심 시간')
  </script>
</body>

</html>
