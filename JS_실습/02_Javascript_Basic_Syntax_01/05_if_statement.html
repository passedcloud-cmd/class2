<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. if 문
    // - 조건식의 결과를 true/false로 바꾼 뒤 판단 (type_coercion.html의 규칙)
    // - 비교는 === 를 사용
    const name = 'customer'

    // [실습 포인트/힌트] if (조건) { } else if (조건) { } else { } - Python의 elif가 아니라 else if
    // [실습 포인트/힌트] 조건은 반드시 소괄호 () 로 감싸고, 블록은 중괄호 {} 로 감쌈
    // TODO: name이 'admin'이면 '관리자님 환영해요', 'customer'이면 '고객님 환영해요',
    //       둘 다 아니면 `반갑습니다. ${name}님`을 출력하세요.
    // 결과: 고객님 환영해요
    if (name === 'admin') {
      console.log('관리자입니다.')
    } else if (name === 'customer') {
      console.log('고객입니다.')
    } else {
      console.log(`반갑습니다. ${name}님.`)
    }

    // 2. 삼항 연산자
    // - 조건 ? 참일 때 값 : 거짓일 때 값
    // - 조건이 2개가 넘어가면 가급적 if 문을 쓰자!
    const age = 20
    // TODO: 삼항 연산자로 age가 18 이상이면 '성인', 아니면 '미성년자'를 message에 저장하고 출력하세요.
    // 결과: 성인
  </script>
</body>

</html>
