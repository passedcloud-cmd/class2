<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

<body>
  <script>
    // 자동 형변환 (Boolean으로 바꾸면 어떻게 될까?)
    // - 조건문, 반복문의 조건 자리에 Boolean이 아닌 값이 오면 아래 규칙으로 true/false가 결정됨
    // - false가 되는 값(falsy): 0, -0, NaN, '', null, undefined, false
    // - 나머지는 모두 true(truthy)
    console.log(Boolean(0)) // false
    console.log(Boolean(10)) // true
    console.log(Boolean(NaN)) // false

    // console.log(Boolean(""))  // false (빈 문자열)
    // console.log(Boolean("hello")) // true
    // console.log(Boolean("0")) // true (내용이 있는 문자열이므로 true)

    // console.log(Boolean(null)) // false
    // console.log(Boolean(undefined)) // false
    // console.log(Boolean([])) // true (빈 배열도 true, Python과 다름!)
    // console.log(Boolean({})) // true (빈 객체도 true, Python과 다름!)

  </script>
</body>

</html>
