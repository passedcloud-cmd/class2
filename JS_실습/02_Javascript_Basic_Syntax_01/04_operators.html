<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. 할당 연산자
    // - 오른쪽 값을 계산해 왼쪽 변수에 할당, 단축 연산자(+=, -= 등) 지원
    let a = 0

    a += 10
    console.log(a) // 10

    a -= 3
    console.log(a) // 7

    a *= 10
    console.log(a) // 70

    a %= 7
    console.log(a) // 0


    // 2. 증감 연산자
    // - x++ : 기존 값을 먼저 반환한 뒤 1 증가 (후위)
    // - ++x : 1 증가시킨 뒤 그 값을 반환 (전위)
    // - 헷갈리기 쉬우므로 a += 1 같은 명시적인 표현을 권장
    let x = 3
    const y = x++
    console.log(x, y) // 4 3

    let m = 3
    const n = ++m
    console.log(m, n) // 4 4


    // 3. 비교 연산자
    console.log(3 > 2) // true
    console.log(3 < 2) // false
    console.log('A' < 'B') // true
    console.log('Z' < 'a') // true (유니코드 값 비교: 대문자가 소문자보다 작음)
    console.log('가' < '나') // true

    // 4. 동등 연산자 (==)
    // - 타입이 다르면 암묵적으로 타입을 바꾼 뒤 비교 -> 예상과 다른 결과가 나올 수 있음
    console.log(1 == 1) // true
    console.log('hello' == 'hello') // true
    console.log('1' == 1) // true
    console.log(0 == false) // true

    // 5. 일치 연산자 (===)
    // - 값과 타입이 모두 같아야 true (타입 변환 없음) -> 이 방식을 권장
    console.log(1 === 1) // true
    console.log('hello' === 'hello') // true
    console.log('1' === 1) // false
    console.log(0 === false) // false

    // 6. 논리 연산자
    console.log(true && false) // false
    console.log(true && true) // true

    console.log(false || true) // true
    console.log(false || false) // false

    console.log(!true) // false

    // --- (중요) 단축 평가 (Short-circuit Evaluation) ---
    // - 결과가 정해지는 순간 평가를 멈추고, 그 순간의 "값"을 그대로 반환 (true/false가 아님)
    // && (AND) 연산: 첫 값이 거짓이면 바로 그 값을 반환, 참이면 뒤의 값을 반환
    console.log(1 && 0) // 0
    console.log(0 && 1) // 0 (0에서 멈춤)
    console.log(4 && 7) // 7

    // || (OR) 연산: 첫 값이 참이면 바로 그 값을 반환, 거짓이면 뒤의 값을 반환
    console.log(1 || 0) // 1 (1에서 멈춤)
    console.log(0 || 1) // 1
    console.log(4 || 7) // 4

    /* 단축평가 활용 예시
    1. 단축평가 활용 예시(Positive)
    let user = null
    const name = user || "Guest" // user가 Falsy(null)이므로 "Guest"
    console.log(name) // "Guest"

    2. 단축평가 활용 예시2(Negative)
    let score = 0 // 0점은 유효한 점수
    let currentScore = score || 50 // 0이 Falsy라서 50이 됨 (버그!)
    console.log(currentScore) // 50

    3. 단축평가 활용 예시3(해결책)
    let score = 0
    let currentScore

    if (score === null || score === undefined) {
        currentScore = 50 // null이나 undefined일 때만 기본값
    } else {
        currentScore = score
    }
    console.log(currentScore) // 0 (정상!)

    4. 최종(ES2020 도입) Null 병합 연산자 (Nullish Coalescing Operator) ??

    let score = 0
    // score가 null이나 undefined가 아니므로(0임), 왼쪽 값(0)을 그대로 사용
    const currentScore = score ?? 50
    console.log(currentScore) // 0

    let user = null
    const name = user ?? "Guest"
    console.log(name) // "Guest"
    */
  </script>
</body>

</html>
